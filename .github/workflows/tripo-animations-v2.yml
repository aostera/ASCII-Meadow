name: Tripo Ashen Vow V2 - 4 Skeletal Animation Clips Once
on:
  push:
    branches: [feat/tripo-ashen-rig-ready]
    paths: [tools/tripo/approvals/anims-v2.json]
permissions: {contents: read}
concurrency:
  group: tripo-ashen-v2-four-animations-once
  cancel-in-progress: false
jobs:
  retarget:
    if: github.event.head_commit.message == 'TRIPO_APPROVE_FOUR_ANIMS_V2_40_CREDITS' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: One Tripo retarget job, four biped presets, maximum 40 credits
        env:
          TRIPO_API_KEY: ${{ secrets.TRIPO }}
        run: python tools/tripo/tripo_animations_v2.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ashen-tripo-v2-four-skeletal-animation-clips
          path: artifacts/tripo-ashen-v2-four-anims/
          if-no-files-found: warn
