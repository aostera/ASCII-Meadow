name: Three Native Foundation Grass QA

on:
  push:
    branches:
      - 'feat/three-native-foundation-*'
  pull_request:
    branches:
      - experiment/threejs-ascii-prototype
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: three-foundation-grass-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ground-contact:
    name: Source stone contact, rotated Gothic ruins, original terrain parity
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Native ground pass and source test syntax
        run: |
          node --check experiments/three/native-ground-contact.js
          node --check tools/check/three-native-foundation-ground.cjs
      - name: Preserve authored map, collision, shadow and 3D stone grass in browsers
        run: |
          python3 -m http.server 8181 >/tmp/three-native-ground-http.log 2>&1 &
          server=$!
          trap 'kill $server 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8181/experiments/three/native.html >/dev/null && break
            sleep 1
          done
          node tools/check/three-native-foundation-ground.cjs http://127.0.0.1:8181
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: three-native-foundation-grass
          path: shots/three-native-foundation-ground
          if-no-files-found: warn
