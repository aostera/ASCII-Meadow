name: Tripo Ashen Vow V2 - ONE paid multiview 10 credits
on:
  push:
    branches: [feat/tripo-ashen-rig-ready]
    paths: [tools/tripo/approvals/multiview-v2.json]
permissions:
  contents: read
  actions: read
concurrency:
  group: tripo-ashen-v2-multiview-once
  cancel-in-progress: false
jobs:
  multiview:
    if: github.event.head_commit.message == 'TRIPO_APPROVE_MULTIVIEW_V2_10_CREDITS' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install pillow
      - name: Retrieve the ALREADY GENERATED Tripo A-pose reference
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/tripo-ashen-rig-v2
          gh run download 38789557466 --repo aostera/ASCII-Meadow --name tripo-ashen-rig-pose-v2-REFERENCE-review --dir /tmp/tripo-ashen-rig-v2
          test -s /tmp/tripo-ashen-rig-v2/ASHEN_VOW_A_POSE_FRONT.png
      - name: One paid Tripo multiview A-pose request (10 credits)
        env:
          TRIPO_API_KEY: ${{ secrets.TRIPO }}
        run: python tools/tripo/tripo_multiview_v2.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tripo-ashen-rig-multiview-v2-FOUR-views
          path: artifacts/tripo-ashen-multiview-v2/
          if-no-files-found: warn
