name: Three Native T08 Performance Baseline

on:
  push:
    branches:
      - 'feat/three-t08-*'
  pull_request:
    branches:
      - experiment/threejs-ascii-prototype
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: three-native-t08-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-and-scene-budget:
    name: Original authored native scene CPU/GPU-call budget, PC and emulated phone
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Check isolated T08 profiler syntax
        run: node --check tools/check/three-native-t08-profile.cjs
      - name: Benchmark castle and all 3 ruins in actual native Three runtime
        run: |
          python3 -m http.server 8181 >/tmp/three-t08-http.log 2>&1 &
          server=$!
          trap 'kill $server 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8181/experiments/three/native.html >/dev/null && break
            sleep 1
          done
          node tools/check/three-native-t08-profile.cjs http://127.0.0.1:8181
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: three-native-t08-performance-baseline
          path: shots/three-native-t08-profile
          if-no-files-found: warn
