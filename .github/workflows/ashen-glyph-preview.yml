name: Ashen Glyph Skeletal Preview

on:
  push:
    branches:
      - feat/three-ashen-glyph-skeleton
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-glyph-rig:
    name: Skeletal glyph knight / actual WebGL browser desktop and phone
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: New skeletal character JS syntax
        run: |
          node --check experiments/three/ashen-glyph-rig.js
          node --check experiments/three/ashen-glyph-shell.mjs
          node --check tools/check/three-ashen-glyph.cjs
      - name: Real rendered ASCII skeleton and 60-frame motions
        run: |
          python3 -m http.server 8181 > /tmp/glyph-rig-server.log 2>&1 &
          server=$!
          trap 'kill $server 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8181/experiments/three/ashen-glyph-rig.html > /dev/null && break
            sleep 1
          done
          node tools/check/three-ashen-glyph.cjs http://127.0.0.1:8181
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ashen-glyph-ik-desktop-phone
          path: shots/three-ashen-glyph/
          if-no-files-found: warn
