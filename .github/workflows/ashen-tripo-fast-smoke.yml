name: Ashen Vow - Fast Real GLB Smoke
on:
  push:
    branches: [feat/ashen-tripo-animation-workshop-20261016]
    paths:
      - experiments/three/ashen-tripo-native-rig.mjs
      - experiments/three/ashen-sole-contact.mjs
      - experiments/three/ashen-blade-envelope.mjs
      - experiments/three/ashen-gothic-longsword.mjs
      - experiments/three/native-tripo-v2.mjs
      - experiments/three/ashen-tripo-animation-workshop.html
      - tools/check/ashen-tripo-smoke.cjs
      - .github/workflows/ashen-tripo-fast-smoke.yml
  workflow_dispatch:
concurrency:
  group: ashen-fast-smoke-${{ github.ref }}
  cancel-in-progress: true
permissions: {contents: read, issues: write}
jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22',cache: npm}
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: |
          node --check experiments/three/ashen-tripo-native-rig.mjs
          node --check tools/check/ashen-tripo-smoke.cjs
      - name: Original 40-joint knight and four 3D motion screenshots
        run: |
          python3 -m http.server 8181 >/tmp/ashen-fast-http.log 2>&1 &
          server=$!
          trap 'kill $server 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8181/experiments/three/ashen-tripo-animation-workshop.html >/dev/null && break
            sleep 1
          done
          node tools/check/ashen-tripo-smoke.cjs http://127.0.0.1:8181
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ashen-v18-fast-real-glb-4-poses
          path: shots/ashen-tripo-smoke/
          if-no-files-found: warn
      - name: Publish fast GLB result to draft PR 56
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SMOKE_STATUS: ${{ job.status }}
          SMOKE_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SMOKE_SHA: ${{ github.sha }}
        run: |
          marker='<!-- ashen-tripo-fast-smoke-status -->'
          printf -v body '%s\n**Real 40-bone Tripo fast smoke:** `%s`\nCommit: `%s` · [GitHub Actions run](%s)\nFour original-GLB pose screenshots are attached to the workflow artifact when generated. This is not the full mobile/performance sign-off.\n' "$marker" "$SMOKE_STATUS" "$SMOKE_SHA" "$SMOKE_RUN"
          existing=$(gh api "repos/${GITHUB_REPOSITORY}/issues/56/comments?per_page=100" --jq '.[] | select(.body | startswith("<!-- ashen-tripo-fast-smoke-status -->")) | .id' | tail -n 1)
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/$existing" -f body="$body" >/dev/null
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/56/comments" -f body="$body" >/dev/null
          fi
