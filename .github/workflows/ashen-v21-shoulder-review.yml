name: Ashen Vow - Real Bone Shoulder Repair Visual QA
on:
  pull_request:
    branches: [feat/ashen-tripo-v2-motion-sword]
    paths:
      - experiments/three/ashen-tripo-native-rig.mjs
      - experiments/three/ashen-tripo-ab-review.html
      - tools/check/ashen-tripo-shoulder-review.cjs
      - .github/workflows/ashen-v21-shoulder-review.yml
  workflow_dispatch:
concurrency:
  group: ashen-v21-arm-${{ github.ref }}
  cancel-in-progress: true
permissions: {contents: read}
jobs:
  anatomy:
    name: Original 40-bone Tripo vs repaired arms - front side back run
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22',cache: npm}
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Check game rig and shoulder review grammar
        run: |
          node --check experiments/three/ashen-tripo-native-rig.mjs
          node --check tools/check/ashen-tripo-shoulder-review.cjs
      - name: Real GLB shoulder screenshot and bone-angle review
        run: |
          python3 -m http.server 8181 >/tmp/ashen-v21-shoulders.log 2>&1 &
          server=$!
          trap 'kill $server 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8181/experiments/three/ashen-tripo-ab-review.html >/dev/null && break
            sleep 1
          done
          node tools/check/ashen-tripo-shoulder-review.cjs http://127.0.0.1:8181
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ashen-v21-anatomical-shoulder-4-real-screenshots
          path: shots/ashen-v21-shoulder-review/
          if-no-files-found: warn
