name: Three Native Editor and Character QA

on:
  push:
    branches:
      - experiment/threejs-ascii-prototype
      - 'fix/three-*'
      - 'claude/three-*'
  pull_request:
    branches:
      - experiment/threejs-ascii-prototype
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: three-native-workshop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  touch-editor-and-character:
    name: Native map editing + animated 3D character (desktop and touch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify secret-leak blockers and portable Git hooks
        run: node tools/check/security-regression.cjs
      - run: npx playwright install --with-deps chromium
      - name: Check real Three runtime/editor syntax
        run: |
          node --check experiments/three/castle-interior.mjs
          node --check experiments/three/castle-interior-layout.mjs
          node --check tools/check/three-castle-interior.cjs
          node tools/check/three-castle-interior-layout.mjs
          node --check experiments/three/native-editor-models.mjs
          node --check tools/check/three-native-grey-editor.cjs
          node --check experiments/three/native-editor-touch.js
          node --check tools/check/three-native-editor-touch.cjs
          node --check experiments/three/native-touch-controls.js
          node --check tools/check/three-native-touch-controls.cjs
          node --check tools/check/three-ashen-vow.cjs
      - name: Run actual WebGL2 map-editor touch, rotation and undo tests
        run: |
          python3 -m http.server 8181 >/tmp/three-native-qa-http.log 2>&1 &
          server=$!
          trap 'kill $server 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8181/experiments/three/native.html >/dev/null && break
            sleep 1
          done
          node tools/check/three-native-grey-editor.cjs http://127.0.0.1:8181
          node tools/check/three-native-editor-touch.cjs http://127.0.0.1:8181
          node tools/check/three-native-touch-controls.cjs http://127.0.0.1:8181
          node tools/check/three-ashen-vow.cjs http://127.0.0.1:8181
          node tools/check/three-castle-interior.cjs http://127.0.0.1:8181
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: three-native-editor-character-shots
          path: |
            shots/three-native-grey-editor
            shots/three-native-editor-touch
            shots/three-native-touch-controls
            shots/three-ashen-vow
            shots/three-castle-interior
          if-no-files-found: warn
