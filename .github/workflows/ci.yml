name: CI

on:
  pull_request:
    branches: [main]
    # labeled/unlabeled: adding or removing `visual-change` re-runs the checks with the PR's current labels
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-parity:
    name: Public Cloudflare site matches GitHub main
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build revision-stamped production assets
        run: sh tools/build_site.sh dist
      - name: Verify published HTML, authored map, grass and depth/shadow renderer
        run: node tools/check/production-parity.cjs

  production-runtime:
    name: 'Public production Chromium: actual map, grass, scenery'
    needs: production-parity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Validate real production game, authored map, grass and screenshots
        run: node tools/check/production-runtime-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-scenes
          path: shots/production/*.png

  static:
    name: Syntax, ESLint, resources, bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install WebP validator (CI-only)
        run: python3 -m pip install 'Pillow==12.0.0'
      - name: Check lossless WebP source assets and generated NPC pixels
        run: python3 tools/migrate_webp.py --check
      - name: Syntax of every script
        run: node tools/check/syntax.cjs
      - name: Actor catalog contract (types, IDs, behaviors, state and resize)
        run: node tools/check/actors.cjs
      - name: Solid fire and brazier collision contract for all movers
        run: node tools/check/fire-collision.cjs
      - name: Three gothic ruins collision geometry and arch-only passages
        run: node tools/check/ruins.cjs
      - name: NPC animation atlas validation (frame geometry, rows and source restrictions)
        run: node tools/check/npc-atlas.cjs
      - name: Verify shipped 8-view NPC art, 288 frames and deterministic source
        run: node tools/check/npc-starter-art.cjs
      - name: Verify hermit sprite 8-view art, 288 frames and deterministic source
        run: node tools/check/npc-hermit-art.cjs
      - name: Check NPC sprite legibility at compact ASCII glyph scale
        run: node tools/check/npc-readability.cjs
      - name: NPC frame quality rules (transparency, duplicates and silhouette continuity)
        run: node tools/check/npc-atlas-audit.cjs
      - name: NPC gallery frame selection (sampling up to 60 frames)
        run: node tools/check/npc-gallery.cjs
      - name: NPC atlas publish path and manifest contract
        run: node tools/check/npc-asset-build.cjs
      - name: Interaction registry (range, actions, NPC talk, stale references)
        run: node tools/check/interactions.cjs
      - name: Validate map import, round-trip integrity and RLE chunks
        run: node tools/check/map-import.cjs
      - name: ESLint (the scripts linted in load order, as one global scope)
        run: node tools/check/lint.cjs --warnings
      - name: Page resources (exist, relative, all loaded, no inline code)
        run: node tools/check/resources.cjs
      - name: Repository hygiene and retained source art
        run: node tools/check/repo-hygiene.cjs
      - name: Verify standalone HTML embeds both NPC PNG atlases
        run: node tools/check/standalone-npc.cjs
      - name: Standalone HTML (tools/bundle.py)
        run: |
          python3 tools/bundle.py dist/ascii-meadow.html
          python3 tools/bundle.py dist/ascii-meadow.body.html --body
          if grep -q '<script src=' dist/ascii-meadow.html; then echo 'bundle still loads external scripts'; exit 1; fi
          if grep -q 'href="styles/' dist/ascii-meadow.html; then echo 'bundle still links styles/'; exit 1; fi
          test "$(grep -c '^<script>$' dist/ascii-meadow.html)" = "$(grep -c '<script src=' index.html)"
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-html
          path: dist/ascii-meadow*.html

  browser:
    name: Game in Chromium (WebGL2, 2D, touch, file://, HTTP sub-folder, bundle)
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Exactly one resident in camp (idle, resize and E interaction, both renderers)
        run: node tools/check/camp-resident-browser.cjs
      - name: Actor catalog in WebGL2 and Canvas 2D (create, render, resize, remove)
        run: node tools/check/actors-browser.cjs
      - name: NPC vs knight size and fire blocking on desktop/phone
        run: node tools/check/npc-fire-browser.cjs
      - name: Three raycast ASCII ruins and passable arches in both renderers
        run: node tools/check/ruins-browser.cjs
      - name: Editable gothic ruins - place, rotate, move, delete, undo and export
        run: node tools/check/ruins-editor-browser.cjs
      - name: Uploaded layout - true ruin cast shadows, no ghost shades after drag undo redo
        run: node tools/check/ruin-shadow-browser.cjs
      - name: Camp 3D shadows, fence roots and reproducible terrain in both renderers
        run: node tools/check/camp-ground-browser.cjs
      - name: Scenery depth and grass regression
        run: node tools/check/scenery-depth-browser.cjs
      - name: iPad Safari WebGL restore and ruin column-offset regression
        run: node tools/check/ruin-context-browser.cjs
      - name: Upload gothic ruins reference screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gothic-ruins-gallery
          path: shots/ruins/
          if-no-files-found: warn
      - name: NPC PNG atlas upload, live preview and draw in WebGL2/Canvas 2D
        run: node tools/check/npc-atlas-browser.cjs
      - name: NPC editor visual gallery (both renderers)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npc-preview-gallery
          path: shots/npc-preview/
          if-no-files-found: warn
      - name: E interactions and NPC dialogues in WebGL2 and Canvas 2D
        run: node tools/check/interactions-browser.cjs
      - name: Road and castle-front fire coordinates (desktop/mobile)
        run: node tools/check/map-placement.cjs
      - name: Editor export/import reproduces entire map and pixels
        run: node tools/check/map-roundtrip.cjs
      - name: NPC v2 map placement, editing, version migration and lossless reload
        run: node tools/check/map-npcs.cjs
      - name: Smoke test from file://
        run: node tools/check/smoke.cjs "file://$GITHUB_WORKSPACE/index.html" --out shots/file
      - name: Smoke test over HTTP from a sub-folder, /ASCII-Meadow/ (relative paths only)
        run: |
          sh tools/build_site.sh /tmp/site/ASCII-Meadow
          (cd /tmp/site && python3 -m http.server 8080 > /tmp/http.log 2>&1 &)
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:8080/ASCII-Meadow/ > /dev/null && break; sleep 1; done
          node tools/check/smoke.cjs http://127.0.0.1:8080/ASCII-Meadow/ --out shots/http --quick
      - name: Smoke test of the standalone HTML
        run: |
          python3 tools/bundle.py dist/ascii-meadow.html
          node tools/check/smoke.cjs "file://$GITHUB_WORKSPACE/dist/ascii-meadow.html" --out shots/bundle --quick
      - name: Upload screenshots and logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure
          path: |
            shots/
            /tmp/http.log

  visual-diff:
    # The base branch and this PR, run with the same seed, clock, window and scripted input on the same runner,
    # compared pixel by pixel (no tolerance: only the game's canvases are captured). Blocking: a PR that
    # only moves code must draw exactly the same frames. A PR that means to change the picture gets the
    # `visual-change` label; the job still runs and uploads the diffs, but then passes.
    name: Visual diff vs base (${{ matrix.name }})
    if: github.event_name == 'pull_request'
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: knight,  args: 'gl 1280 800 "" main' }     # idle, walk, run, jump, mouse in the grass, resize
          - { name: dirs,    args: 'gl 1280 800 "" dirs' }     # 8 walk directions, 4 run directions, the herd
          - { name: cows,    args: 'gl 1280 800 "" cows' }     # standing, strolling, grazing, a spooked herd
          - { name: castle,  args: 'gl 1280 800 "" castle' }   # wall, stair, terrace, E at the gate
          - { name: fallback-2d, args: '2d 640 400 "" main' }  # the 2D canvas fallback
          - { name: mobile,  args: 'gl 0 0 mob touch' }        # iPhone 13: drag to walk and run, taps
    steps:
      - uses: actions/checkout@v4
        with:
          path: head
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: head/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: head
      - run: npx playwright install --with-deps chromium
        working-directory: head
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow   # the pixel diff
      - name: Seeded runs of base and head
        working-directory: head
        run: |
          node tools/check/det.cjs "file://$GITHUB_WORKSPACE/base/index.html" shots/base ${{ matrix.args }}
          node tools/check/det.cjs "file://$GITHUB_WORKSPACE/head/index.html" shots/head ${{ matrix.args }}
      - name: Pixel diff
        id: diff
        working-directory: head
        run: |
          set +e
          python3 tools/check/diff.py shots/base shots/head --out shots/diff > shots/diff.txt
          echo "code=$?" >> "$GITHUB_OUTPUT"
          cat shots/diff.txt
      - name: Summary
        if: always()
        working-directory: head
        run: |
          { echo "### Visual diff vs base: ${{ matrix.name }}"; echo '```'; cat shots/diff.txt 2>/dev/null || echo 'no result'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-diff-${{ matrix.name }}
          path: |
            head/shots/diff/
            head/shots/diff.txt
      - uses: actions/upload-artifact@v4
        if: failure() || steps.diff.outputs.code != '0'
        with:
          name: visual-shots-${{ matrix.name }}
          path: head/shots/
      - name: Gate
        if: steps.diff.outputs.code != '0'
        run: |
          code=${{ steps.diff.outputs.code }}
          if [ "$code" != "1" ]; then
            echo "::error::the comparison itself failed (diff.py exit $code): see the log above"; exit 1
          fi
          if ${{ contains(github.event.pull_request.labels.*.name, 'visual-change') }}; then
            echo "::warning::frames differ from the base branch; allowed by the visual-change label"
          else
            echo "::error::frames differ from the base branch (see the visual-diff artifacts). If the change to the picture is intended, add the visual-change label."
            exit 1
          fi

  three-prototype:
    name: Three.js experiment (real WebGL, authored-map scene, phone viewport)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Module syntax
        run: |
          node --check experiments/three/app.js
          node --check experiments/three/knight-ascii.js
          node --check experiments/three/castle.js
          node --check experiments/three/gpu-timing.js
          node --check tools/check/three-prototype.cjs
          node --check tools/check/three-unit.cjs
      - name: Ground and GPU timing unit tests
        run: node tools/check/three-unit.cjs
      - name: Install screenshot inspector
        run: python3 -m pip install 'Pillow==12.0.0'
      - name: Render actual 3D scene and preserve the author map
        run: |
          python3 -m http.server 8181 > /tmp/three-http.log 2>&1 &
          server=$!
          trap 'kill $server 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:8181/experiments/three/ > /dev/null && break; sleep 1; done
          node tools/check/three-prototype.cjs http://127.0.0.1:8181
      - name: Reject nearly blank ASCII screenshots
        run: python3 tools/check/three-visibility.py shots/three/desktop.png shots/three/phone.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: three-prototype-screenshots
          path: shots/three/
          if-no-files-found: warn

  three-parity:
    name: Exact-world Three.js renderer migration (original game + experimental backend)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Check new migration module syntax
        run: |
          node --check experiments/three/parity.js
          node --check experiments/three/three-glyphs.js
          node --check tools/check/three-parity.cjs
          node tools/check/three-source-sync.cjs
      - name: Render original full game through both rasterizers
        run: |
          python3 -m http.server 8181 > /tmp/parity-http.log 2>&1 &
          server=$!
          trap 'kill $server 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:8181/experiments/three/parity.html > /dev/null && break; sleep 1; done
          node tools/check/three-parity.cjs http://127.0.0.1:8181
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-world-three-parity
          path: shots/three-parity/
          if-no-files-found: warn
