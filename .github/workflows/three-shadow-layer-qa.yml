name: Three Native Architectural Shadow Layers QA

on:
  push:
    branches:
      - 'fix/three-shadow-*'
  pull_request:
    branches:
      - experiment/threejs-ascii-prototype
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: three-shadow-layer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture-shadow-layer:
    name: Architectural shadows, foliage and editor consistency
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Native shadow implementation and browser test syntax
        run: |
          node --check experiments/three/native-shadow-soften.js
          node --check tools/check/three-native-shadow-layer.cjs
      - name: Compare authored raycasts to softened shadows, verify foliage/editor snapshots
        run: |
          python3 -m http.server 8181 >/tmp/three-native-shadows-http.log 2>&1 &
          server=$!
          trap 'kill $server 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8181/experiments/three/native.html >/dev/null && break
            sleep 1
          done
          node tools/check/three-native-shadow-layer.cjs http://127.0.0.1:8181
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: three-native-architectural-shadow-layer
          path: shots/three-native-shadow-layer
          if-no-files-found: warn
