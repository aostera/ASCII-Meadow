name: Tripo Ashen Vow - FREE Preflight Only

on:
  push:
    branches:
      - feat/tripo-ashen-budget-gated
    paths:
      - tools/tripo/tripo_budget.py
      - .github/workflows/tripo-budget-preflight.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  free-balance-and-references:
    name: Free balance check, no generation
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check script syntax
        run: python -m py_compile tools/tripo/tripo_budget.py
      - name: Read-only Tripo wallet
        env:
          TRIPO_API_KEY: ${{ secrets.TRIPO_API_KEY }}
        run: |
          if [ -z "$TRIPO_API_KEY" ]; then
            echo "::warning title=Missing TRIPO_API_KEY::GitHub Actions received an EMPTY repository secret. Check Settings > Secrets and variables > Actions > Repository secrets for this exact repository."
          else
            python tools/tripo/tripo_budget.py balance
          fi
          echo 'No paid Tripo API tasks were submitted.'
      - name: Crop existing approved front/left/back/right art for FREE
        run: |
          python -m pip install --disable-pip-version-check pillow
          python tools/tripo/tripo_budget.py prepare
          echo 'Only Python image cropping: zero AI generations.'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ashen-tripo-approved-reference-views-free
          path: artifacts/tripo-ashen-vow/*.jpg
          if-no-files-found: warn
