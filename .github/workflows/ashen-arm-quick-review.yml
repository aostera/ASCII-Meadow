name: Ashen Vow — Fast Arm and Sword Pose QA
on:
  push:
    branches: [feat/ashen-tripo-animation-workshop-20261016]
    paths:
      - experiments/three/ashen-tripo-native-rig.mjs
      - experiments/three/source-motion.mjs
      - experiments/three/ashen-sole-contact.mjs
      - tools/check/ashen-tripo-sole-contact.cjs
      - tools/check/ashen-tripo-source-motion.cjs
      - experiments/three/ashen-gothic-longsword.mjs
      - tools/check/ashen-tripo-arm-review.cjs
      - .github/workflows/ashen-arm-quick-review.yml
  workflow_dispatch:
concurrency:
  group: ashen-arm-preview-${{ github.ref }}
  cancel-in-progress: true
permissions: {contents: read}
jobs:
  pose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22',cache: npm}
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: |
          node --check experiments/three/ashen-tripo-native-rig.mjs
          node --check experiments/three/source-motion.mjs
          node --check tools/check/ashen-tripo-source-motion.cjs
          node tools/check/ashen-tripo-source-motion.cjs
          node --check experiments/three/ashen-sole-contact.mjs
          node --check tools/check/ashen-tripo-sole-contact.cjs
          node tools/check/ashen-tripo-sole-contact.cjs
          node --check tools/check/ashen-tripo-arm-review.cjs
      - name: Verify real wrist/elbow and save 4 studio frames
        run: |
          python3 -m http.server 8181 >/tmp/ashen-arm-http.log 2>&1 &
          server=$!
          trap 'kill $server 2>/dev/null || true' EXIT
          for i in $(seq 1 25); do
            curl -sf http://127.0.0.1:8181/experiments/three/ashen-tripo-animation-workshop.html >/dev/null && break
            sleep 1
          done
          node tools/check/ashen-tripo-arm-review.cjs http://127.0.0.1:8181
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ashen-arm-review-frames
          path: shots/ashen-arm-review/
          if-no-files-found: warn
