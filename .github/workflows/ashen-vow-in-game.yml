name: Ashen Vow / Actual Native Game

on:
  push:
    branches:
      - feat/three-ashen-vow-in-game
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-player:
    name: Ashen Vow as playable in-world 3D skinned ASCII knight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Validate native player and rig modules
        run: |
          node --check experiments/three/native.js
          node --check experiments/three/native-ashen-vow.mjs
          node --check experiments/three/ashen-vow-game-model.mjs
          node --check tools/check/ashen-vow-in-game.cjs
      - name: Render actual source game with ASHEN VOW 3D, gameplay and sprites
        run: |
          python3 -m http.server 8181 >/tmp/native-ashen-http.log 2>&1 &
          http=$!
          trap 'kill $http 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8181/experiments/three/native.html >/dev/null && break
            sleep 1
          done
          node tools/check/ashen-vow-in-game.cjs http://127.0.0.1:8181
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ashen-vow-actual-gameplay
          path: shots/ashen-vow-in-game/
          if-no-files-found: warn
