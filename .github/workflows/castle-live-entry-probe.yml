name: Published Castle Entry QA

on:
  push:
    branches:
      - experiment/threejs-ascii-prototype
      - 'fix/three-castle-entry-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: published-castle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  published-castle:
    name: Verify real Cloudflare castle entrance (desktop / phone)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check non-inherited CSP in generated Cloudflare assets
        run: |
          sh tools/build_site.sh dist
          node - <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const blocks=fs.readFileSync('dist/_headers','utf8').split(/(?=^\/[^\r\n]*$)/m);
          const wild=blocks.find(x=>x.startsWith('/*\n'));
          const native=blocks.find(x=>x.startsWith('/experiments/three/*\n'));
          const home=blocks.find(x=>x.startsWith('/\n'));
          assert(wild&&!/Content-Security-Policy:/i.test(wild),
            'Wildcard policy would block Three.js even with a narrower CDN policy');
          assert(native?.includes('https://cdn.jsdelivr.net')&&native.includes('sha256-'));
          assert(home?.includes("script-src 'self'"));
          console.log('PASS Cloudflare CSP isolation (exterior strict; native pinned CDN + importmap)');
          NODE
      - run: npx playwright install --with-deps chromium
      - name: Open REAL published preview and enter/exit the castle in Chromium
        run: |
          set -eu
          case "$GITHUB_REF_NAME" in
            experiment/threejs-ascii-prototype)
              base='https://experiment-threejs-ascii-prototype-ascii-meadow.aloster36.workers.dev' ;;
            fix/three-castle-entry-*)
              base='https://fix-three-castle-entry-20261017-ascii-meadow.aloster36.workers.dev' ;;
            *) echo 'Unsupported Cloudflare preview branch' >&2; exit 2 ;;
          esac
          revision=$(git rev-parse --short=12 HEAD)
          ready=0
          # Do not accidentally accept a green test against a prior build.
          for i in $(seq 1 48); do
            if curl -fsSL --max-time 12 "$base/build.json" -o /tmp/castle-build.json &&
               grep -Fq "\"revision\":\"$revision\"" /tmp/castle-build.json; then
              ready=1; break
            fi
            sleep 5
          done
          test "$ready" -eq 1 || { echo 'Updated Cloudflare preview not published'; exit 1; }
          node tools/check/three-castle-live.cjs "$base"
