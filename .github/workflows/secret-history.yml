name: Git History Secret Audit

on:
  push:
    branches: [main, experiment/threejs-ascii-prototype]
  pull_request:
    branches: [main, experiment/threejs-ascii-prototype]
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

concurrency:
  group: git-secret-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan-history:
    name: Redacted full-ref Git history scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch remote branches and PR heads (read-only)
        shell: bash
        run: |
          git fetch --no-tags --force origin '+refs/heads/*:refs/remotes/origin/*' '+refs/pull/*/head:refs/remotes/audit-pr/*'
      - name: Scan all reachable text blobs, commit messages and filenames
        run: python3 tools/check/secret-history.py
