name: Tripo Ashen Vow Rig Reference V2 - ONE image task
on:
  push:
    branches: [feat/tripo-ashen-rig-ready]
    paths: [tools/tripo/approvals/pose-v2.json]
permissions:
  contents: read
concurrency:
  group: tripo-ashen-rig-reference-v2-paid
  cancel-in-progress: false
jobs:
  generate-tripo-reference:
    if: github.event.head_commit.message == 'TRIPO_APPROVE_RIG_REFERENCE_V2_5_CREDITS' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install pillow
      - name: Generate A-pose reference in Tripo, max 5 credits, no retries
        env:
          TRIPO_API_KEY: ${{ secrets.TRIPO }}
        run: python tools/tripo/rig_reference_v2.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tripo-ashen-rig-pose-v2-REFERENCE-review
          path: artifacts/tripo-ashen-rig-v2/
          if-no-files-found: warn
