name: Three Source Deadwood Depth QA

on:
  push:
    branches:
      - 'feat/three-native-deadwood-*'
  pull_request:
    branches:
      - experiment/threejs-ascii-prototype
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: three-deadwood-${{ github.ref }}
  cancel-in-progress: true

jobs:
  physical-source-depth:
    name: Source deadwood and living tree depth on desktop and phone
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Validate native depth modules and smoke scripts
        run: |
          node --check experiments/three/native-tree-depth.mjs
          node --check experiments/three/native-architecture-depth.mjs
          node --check experiments/three/native.js
          node --check tools/check/three-native-deadwood-depth.cjs
      - name: Verify source dead-tree and live tree per-actor GPU clipping
        run: |
          python3 -m http.server 8181 > /tmp/native-deadwood-http.log 2>&1 &
          server=$!
          trap 'kill $server 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8181/experiments/three/native.html > /dev/null && break
            sleep 1
          done
          node tools/check/three-native-deadwood-depth.cjs http://127.0.0.1:8181
          node tools/check/three-native-tree-depth.cjs http://127.0.0.1:8181
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: three-native-deadwood-screens
          path: |
            shots/three-native-deadwood
            shots/three-native-trees
          if-no-files-found: warn
