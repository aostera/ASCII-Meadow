name: Three Native Castle Tracery QA

on:
  push:
    branches:
      - 'feat/three-castle-*'
  pull_request:
    branches:
      - experiment/threejs-ascii-prototype
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: three-native-castle-tracery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  castle-relief:
    name: Real source masonry and original Gothic gate clearance
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Validate physical castle detail and QA syntax
        run: |
          node --check experiments/three/native-gothic-complete.js
          node --check tools/check/three-native-castle-tracery.cjs
      - name: Inspect playable Three.js castle facade on PC and touch viewport
        run: |
          python3 -m http.server 8181 >/tmp/three-native-castle-tracery-http.log 2>&1 &
          server=$!
          trap 'kill $server 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8181/experiments/three/native.html >/dev/null && break
            sleep 1
          done
          node tools/check/three-native-castle-tracery.cjs http://127.0.0.1:8181
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: three-native-castle-tracery
          path: shots/three-native-castle-tracery
          if-no-files-found: warn
