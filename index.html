<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ASCII Meadow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Rubik:wght@400;500&display=swap">
<style>
/* Layout: one full-bleed canvas world, a quiet HUD tucked into the corners. Single dark look by choice. */
:root {
  --bg: #0c0c0c;
  --ink: #fafafa;
  --dim: #6b6b6b;
  --hud: rgba(12, 12, 12, .78);
  --line: #222222;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --ui: "Rubik", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--mono); overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
.hud { position: fixed; left: 16px; top: calc(16px + env(safe-area-inset-top, 0px)); max-width: calc(100% - 32px); padding: 10px 12px; background: var(--hud); border: 1px solid var(--line); display: grid; gap: 4px; pointer-events: none; }
.hud h1 { margin: 0; font: 500 14px/1.2 var(--ui); letter-spacing: .01em; }
.hud p { margin: 0; font: 400 12px/1.4 var(--ui); color: var(--dim); }
.hud kbd { font-family: inherit; color: var(--ink); }
.stats { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; text-align: right; pointer-events: none; line-height: 1.5; white-space: pre; }
</style>
</head>
<body>

<canvas id="g" aria-hidden="true"></canvas>
<canvas id="c" aria-label="ASCII grass field. Move with WASD or arrow keys, or drag. Tap to send a gust."></canvas>
<div class="hud">
  <h1>ASCII MMORPG</h1>
  <p><kbd>WASD</kbd> or drag to walk · <kbd>E</kbd> or tap a prompt to use · <kbd>Space</kbd> to jump</p>
</div>
<div class="stats" id="stats"></div>

<script>
(() => {
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');  // overlay: names, prompts, fog, vignette. The world itself is drawn by the glyph batch.
  const statsEl = document.getElementById('stats');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const FONT = '"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace';

  let DPR, W, H, FS, CW, CH, COLS, ROWS, N, HZ = 0, VC, VR, bshade, bmask, segs, FR, TA;
  let ang, vel, flat, push, shadow, height, seed, kind;

  // ---------- noise ----------
  const hash = (x, y) => { let h = (x * 374761393 + y * 668265263) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967295; };
  const sm = t => t * t * (3 - 2 * t);
  function vnoise(x, y) {
    const xi = Math.floor(x), yi = Math.floor(y), xf = sm(x - xi), yf = sm(y - yi);
    const a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1);
    return a + (b - a) * xf + (c - a) * yf + (a - b - c + d) * xf * yf;
  }

  // ---------- palette ----------
  const SH = 18; // grass shades, dark → sunlit
  const COLORS = [];
  for (let i = 0; i < SH; i++) {
    const t = i / (SH - 1);
    COLORS.push(`hsl(0 0% ${3 + Math.pow(t, 1.6) * 40}%)`);
  }
  const C_WHITE = COLORS.push('#bdbdbd') - 1;
  const C_YEL = COLORS.push('#8a8a8a') - 1;
  const C_LAV = COLORS.push('#6b6b6b') - 1;
  const C_DIRT = COLORS.push('#1e1e1e') - 1;
  const C_DIRT2 = COLORS.push('#151515') - 1;
  const C_STONE = COLORS.push('#3a3a3a') - 1;
  const C_STONE2 = COLORS.push('#6b6b6b') - 1;
  const C_DEW = COLORS.push('#eaeaea') - 1;
  const BL0 = COLORS.length, BLN = 14; // stone greys for buildings
  for (let k = 0; k < BLN; k++) { const l = 5 + Math.pow(k / (BLN - 1), 1.1) * 83; COLORS.push(`hsl(0 0% ${l}%)`); }
  const PT0 = COLORS.length, PTN = 8; // pale trail
  for (let k = 0; k < PTN; k++) COLORS.push(`hsl(0 0% ${16 + k * 6.5}%)`);
  const NB = COLORS.length;

  const CHARS = " |li!:/\\_-~.,'`*o@°+\"^;=adbqQ08$%&#";
  const CI = {}; [...CHARS].forEach((c, i) => CI[c] = i);

  // ---------- glyph atlas: every (char, colour) pre-rendered once, then blitted ----------
  let atlas, AW, AH;
  function buildAtlas() {
    AW = Math.ceil(CW * DPR) + 2; AH = Math.ceil(CH * DPR) + 2;
    atlas = document.createElement('canvas');
    atlas.width = AW * CHARS.length; atlas.height = AH * NB;
    const a = atlas.getContext('2d');
    a.font = `${FS * DPR}px ${FONT}`;
    a.textBaseline = 'top';
    for (let b = 0; b < NB; b++) {
      a.fillStyle = COLORS[b];
      for (let c = 1; c < CHARS.length; c++) a.fillText(CHARS[c], c * AW + 1, b * AH + 1);
    }
  }
  function blit(ci, b, x, y, a = 1) { gput(ci * NB + b, x, y, a); }

  // ---------- world ----------
  // the trail: winds up from the south edge and straightens as it reaches the castle stair
  function pathX(row) {
    const C = cathedral, g = C.gateRow || ROWS * 0.45, d = Math.max(0, Math.min(1, (row - g) / (ROWS - g)));
    const sw = d * d * (3 - 2 * d);
    return COLS * 0.5 + (Math.sin(row * 0.019 + 1.3) * 0.26 + Math.sin(row * 0.047) * 0.09) * VC * sw;
  }
  function carvePath() {
    const g = Math.floor(cathedral.gateRow || ROWS * 0.45);
    for (let y = g; y < ROWS; y++) {
      const cx = pathX(y), near = Math.max(0, 1 - (y - g) / 40);
      const hw = 6 + 2.5 * vnoise(y * 0.05, 3) + near * 12;
      for (let x = Math.max(0, Math.floor(cx - hw - 4)); x <= Math.min(COLS - 1, Math.ceil(cx + hw + 4)); x++) {
        const i = y * COLS + x, d = Math.abs(x + 0.5 - cx) - hw + (vnoise(x * 0.3, y * 0.4) - 0.5) * 2.5;
        if (bmask[i]) continue;
        if (d < 0) { kind[i] = 7; height[i] = Math.max(0, Math.min(1, 0.55 + 0.5 * vnoise(x * 0.11, y * 0.17) - Math.max(0, d + 2) * 0.12)); segs[i] = 0; }
        else if (kind[i] === 1) { segs[i] = 1; height[i] *= 0.35 + d * 0.15; }  // trodden verge
      }
    }
  }
  function build() {
    DPR = Math.min(devicePixelRatio || 1, 2);
    W = Math.max(1, innerWidth); H = Math.max(1, innerHeight);
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    if (GL.ok) GL.resize(); else { const gc = document.getElementById('g'); gc.width = cv.width; gc.height = cv.height; }
    FS = Math.max(8, Math.min(11, Math.sqrt(W * H / (0.59 * 24000))));
    CW = FS * 0.6; CH = FS * 0.92;
    VC = W / CW; VR = H / CH;                       // what the camera sees
    MS = Math.max(0.5, Math.min(1.25, H / 820)) * CASTLE_SCALE;  // castle model unit → px; gate ≈ 3.3 knights tall
    COLS = Math.ceil(Math.max(VC * 2.2, (1800 * MS + W) / CW)); ROWS = Math.ceil((2180 * MS + 60 + H * 5) / CH); N = COLS * ROWS; // castle far north, a long walk up to it
    ang = new Float32Array(N); vel = new Float32Array(N); flat = new Float32Array(N);
    bshade = new Float32Array(N); bmask = new Uint8Array(N); FR = new Float32Array(N);
    TA = new Float32Array(COLS * 6);
    push = new Float32Array(N); shadow = new Float32Array(N);
    height = new Float32Array(N); seed = new Float32Array(N); kind = new Uint8Array(N); segs = new Uint8Array(N);
    let blades = 0;
    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
      const i = y * COLS + x;
      const n = vnoise(x * 0.035, y * 0.055) * 0.65 + vnoise(x * 0.12, y * 0.18) * 0.25 + vnoise(x * 0.4, y * 0.6) * 0.1;
      const rock = vnoise(x * 0.09 + 50, y * 0.14 + 50);
      const r = hash(x + 911, y + 37);
      seed[i] = hash(x, y);
      height[i] = Math.min(1, Math.max(0.12, n * 1.35 - 0.08 + (r - 0.5) * 0.4));
      if (rock > 0.9 && r > 0.35) kind[i] = 5;                           // stones
      else if (n < 0.24 && r < 0.8) kind[i] = 2;               // bare earth
      else if (r > 0.988) kind[i] = 3;                        // white clover
      else if (r > 0.982 && n > 0.5) kind[i] = 4;             // buttercup
      else if (r > 0.978 && n > 0.6) kind[i] = 6;             // heather
      else { kind[i] = 1; blades++; }
      // tall meadow in broad patches: up to four glyphs high, enough to hide a knight's boots and knees
      const tall = Math.max(0, Math.min(1, (vnoise(x * 0.018 + 9, y * 0.028) - 0.32) / 0.4));
      segs[i] = 1 + Math.round(tall * (0.4 + height[i] * 0.6) * 3.4);
    }
    build.blades = blades;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    buildAtlas();
    buildMegaAtlas();
    buildWorld();
    carvePath();
    buildFlora();
  }

  // ---------- entities ----------
  // Characters are 2D rigs: shaded shapes drawn to an offscreen buffer, then dithered into tiny glyphs.
  const mk = (name, cls, tint, opts = {}) => ({
    x: 0, y: 0, tx: 0, ty: 0, name, cls, tint, dir: 'down', step: 0, walk: 0, swing: 0, wait: 0, moving: false, face: 1,
    say: '', sayT: 0, sayCd: 0, label: '#cfdccf', ...opts,
  });
  const player = mk('you', 'knight', [236, 236, 236], { me: true, label: '#9a9a9a' });
  const npcs = []; // the knight walks the meadow alone
  const ents = [player, ...npcs];
  function placeEntities() {
    player.y = ROWS - VR * 0.3; player.x = pathX(player.y) - 3;
    player.dir = 'up'; player.d8 = 4;
    updateCamera(0, true);
  }

  // butterflies & pollen
  const flies = [], motes = [], dew = [];
  function seedLife() {
    flies.length = 0; motes.length = 0;
    const nf = Math.round(COLS * ROWS / 4000) + 3;
    for (let k = 0; k < nf; k++) flies.push({ x: Math.random() * COLS, y: HZ + 2 + Math.random() * (ROWS - HZ - 4), vx: 0, vy: 0, ph: Math.random() * 6, c: C_WHITE, hx: Math.random() * COLS, hy: HZ + 2 + Math.random() * (ROWS - HZ - 4) });
    const nm = Math.round(W * H / 9000);
    for (let k = 0; k < nm; k++) motes.push({ x: Math.random() * W, y: Math.random() * H, z: 0.4 + Math.random() * 0.6, ph: Math.random() * 6 });
  }

  // ---------- input ----------
  const keys = new Set();
  addEventListener('keydown', e => {
    keys.add(e.key.toLowerCase());
    if (e.code === 'Space') { jump(); e.preventDefault(); }
    if (e.key.toLowerCase() === 'g') gust(player.x, player.y);
    if (e.key.startsWith('Arrow')) e.preventDefault();
    if (e.key.toLowerCase() === 'e') useSpot();
  });
  addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
  addEventListener('blur', () => keys.clear());
  let ptr = null;
  cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); ptr = { x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY, t: performance.now(), held: false }; });
  // a hovering mouse brushes the grass aside, harder the faster it moves
  const mouse = { x: 0, y: 0, sp: 0, on: false, lx: 0, ly: 0 };
  cv.addEventListener('pointermove', e => { if (e.pointerType === 'mouse') { mouse.x = e.clientX; mouse.y = e.clientY; mouse.on = true; } });
  cv.addEventListener('pointerleave', () => { mouse.on = false; });
  cv.addEventListener('pointermove', e => { if (ptr) { ptr.x = e.clientX; ptr.y = e.clientY; if (Math.hypot(ptr.x - ptr.sx, ptr.y - ptr.sy) > 12) ptr.held = true; } });
  const up = () => { const bx = activeSpot && activeSpot.box; if (ptr && bx && !ptr.held && ptr.x >= bx[0] && ptr.x <= bx[0] + bx[2] && ptr.y >= bx[1] && ptr.y <= bx[1] + bx[3]) { useSpot(); ptr = null; return; } if (ptr && !ptr.held && performance.now() - ptr.t < 250) { const gx = ptr.x / CW + camX, gy = ptr.y / CH + camY; if (Math.hypot(gx - player.x, (gy - player.y) * CH / CW) < 10) strike(); else gust(gx, gy); } ptr = null; };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);

  const rings = [];
  function strike() { jump(); }
  function gust(x, y) {
    rings.push({ x, y, r: 0, life: 1 });
    for (const m of motes) { const dx = m.x / CW + camX - x, dy = m.y / CH + camY - y, d = Math.hypot(dx, dy) + 1; m.kx = dx / d * 260; m.ky = dy / d * 160; }
  }

  // ---------- simulation ----------
  const R_X = 11, R_Y = 6.5;
  function brush(bx, by, s, dt) {  // like a foot without the weight: parts the blades, never flattens them
    const rx = R_X * 1.1, ry = R_Y * 1.1;
    const x0 = Math.max(0, Math.floor(bx - rx)), x1 = Math.min(COLS - 1, Math.ceil(bx + rx));
    const y0 = Math.max(0, Math.floor(by - ry)), y1 = Math.min(ROWS - 1, Math.ceil(by + ry * 0.6));
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
      const dx = (x + 0.5 - bx) / rx, dy = (y + 0.5 - by) / ry, d = Math.sqrt(dx * dx + dy * dy);
      if (d >= 1) continue;
      const i = y * COLS + x;
      push[i] += Math.sign(dx || 0.01) * (1 - d) * (1 - d) * 3.2 * s;
      if (d < 0.5 && s > 1) flat[i] = Math.min(0.5, flat[i] + (0.5 - d) * dt * 3 * (s - 1));  // a fast sweep leaves a faint wake that springs back
    }
  }
  function influence(e, dt) {
    if (jumpPx(e) > 2) return;
    const s = e.moving ? 1 : 0.55;
    const x0 = Math.max(0, Math.floor(e.x - R_X)), x1 = Math.min(COLS - 1, Math.ceil(e.x + R_X));
    const y0 = Math.max(0, Math.floor(e.y - R_Y)), y1 = Math.min(ROWS - 1, Math.ceil(e.y + 2));
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
      const dx = (x + 0.5 - e.x) / R_X, dy = (y + 0.5 - e.y) / R_Y;
      const d = Math.sqrt(dx * dx + dy * dy);
      if (d >= 1) continue;
      const i = y * COLS + x;
      push[i] += Math.sign(dx || 0.01) * (1 - d) * (1 - d) * 2.6 * s;
      if (d < 0.12) flat[i] = Math.min(1, flat[i] + dt * 1.4);
      // soft contact shadow, flattened ellipse around the feet
      const sx = (x + 0.5 - e.x) / 7, sy = (y + 0.5 - e.y - 0.3) / 2;
      const sd = sx * sx + sy * sy;
      if (sd < 1) shadow[i] = Math.max(shadow[i], (1 - sd) * 0.7);
    }
  }

  function move(e, mx, my, dt, speed) {
    const len = Math.hypot(mx, my);
    e.moving = len > 0.01;
    if (e.moving) {
      const nx = e.x + mx / len * speed * dt, ny = e.y + my / len * speed * dt * (CW / CH);
      if (!blocked(nx, ny, e)) { e.x = nx; e.y = ny; }
      else if (!blocked(nx, e.y, e)) e.x = nx;   // slide along the wall
      else if (!blocked(e.x, ny, e)) e.y = ny;
      e.step += dt * speed * 0.55;
      if (Math.abs(mx) >= Math.abs(my) * 0.75) { e.dir = 'side'; e.face = Math.sign(mx); }
      else e.dir = my > 0 ? 'down' : 'up';
      if (Math.abs(mx) > len * 0.3) e.face = Math.sign(mx);
      const sec = Math.round(Math.atan2(mx, my) / (Math.PI / 4));   // 0 = towards the camera, +2 = right
      e.d8 = { 0: 0, 1: 7, 2: 6, 3: 5, 4: 4, '-4': 4, '-1': 1, '-2': 2, '-3': 3 }[sec];
    }
    e.x = Math.max(4, Math.min(COLS - 5, e.x));
    e.y = Math.max(8, Math.min(ROWS - 3, e.y));
    const hs = surfAt(e.x, e.y);
    if (isFinite(hs)) e.hT = hs;
    e.h = (e.h || 0) + (e.hT - (e.h || 0)) * Math.min(1, dt * 14);   // climb each tread smoothly
  }
  const liftPx = e => (e.h || 0) * COSP * MS;

  let t = 0;
  function simulate(dt) {
    t += dt;
    let mx = 0, my = 0;
    if (keys.has('a') || keys.has('arrowleft')) mx -= 1;
    if (keys.has('d') || keys.has('arrowright')) mx += 1;
    if (keys.has('w') || keys.has('arrowup')) my -= 1;
    if (keys.has('s') || keys.has('arrowdown')) my += 1;
    if (ptr && ptr.held) {
      const dx = ptr.x / CW + camX - player.x, dy = (ptr.y / CH + camY - player.y) * (CH / CW);
      if (Math.hypot(dx, dy) > 1.5) { mx = dx; my = dy; }
    }
    player.inp = [mx, my];
    if (player.jump > 0) {
      // a jump carries him the way he was heading when he pushed off; with no direction held he jumps on the spot
      const tt = (1 - player.jump) * JUMP_T, [jx, jy] = player.jv || [0, 0];
      const air = tt > AIR0 - 0.07 && tt < AIR1 + 0.04;
      if (air && (jx || jy)) move(player, jx, jy, dt, 26 * Math.sin(Math.PI * Math.min(1, Math.max(0, (tt - AIR0 + 0.07) / (AIR1 - AIR0 + 0.11)))) + 8);
      else move(player, 0, 0, dt, 0);
    } else move(player, mx, my, dt, 12.5);
    for (const n of npcs) {
      const px = player.x - n.x, py = (player.y - n.y) * (CH / CW), pd = Math.hypot(px, py);
      n.sayCd -= dt; n.sayT -= dt;
      if (pd < 14 && n.sayCd <= 0) { n.say = n.lines[(Math.random() * n.lines.length) | 0]; n.sayT = 3; n.sayCd = 10; n.tx = n.x; n.ty = n.y; n.wait = 3; }
      const dx = n.tx - n.x, dy = (n.ty - n.y) * (CH / CW);
      if (Math.hypot(dx, dy) < 1) {
        move(n, 0, 0, dt, 0);
        if (pd < 18) n.face = Math.sign(px) || n.face;
        if ((n.wait -= dt) <= 0) { n.tx = 6 + Math.random() * (COLS - 12); n.ty = 12 + Math.random() * (ROWS - 16); n.wait = 1.5 + Math.random() * 4; }
      } else move(n, dx, dy, dt, 8);
    }
    for (const e of ents) { e.walk += ((e.moving ? 1 : 0) - e.walk) * Math.min(1, dt * 8); e.swing = Math.max(0, e.swing - dt * 2.6);
      if (e.jump > 0) { e.jump = Math.max(0, e.jump - dt / JUMP_T); if (!e.landed && (1 - e.jump) * JUMP_T >= AIR1) { e.landed = true; gust(e.x, e.y + 0.5); } }
    }

    updateCamera(dt);
    { // the grass only lives in view: clear just that band, not the whole field
      const x0 = Math.max(0, VX0 - 12), x1 = Math.min(COLS, VX1 + 13), y0 = Math.max(0, VY0 - 10), y1 = Math.min(ROWS, VY1 + 12);
      for (let y = y0; y < y1; y++) { const o = y * COLS; push.fill(0, o + x0, o + x1); shadow.fill(0, o + x0, o + x1); }
    }
    for (const e of ents) influence(e, dt);
    if (mouse.on) {
      const mx = mouse.x / CW + camX, my = mouse.y / CH + camY;
      const v = Math.hypot(mx - mouse.lx, (my - mouse.ly) * CH / CW) / Math.max(dt, 1e-3);
      mouse.sp += (Math.min(1, v / 120) - mouse.sp) * Math.min(1, dt * 10);
      mouse.lx = mx; mouse.ly = my;
      brush(mx, my, 0.75 + mouse.sp * 1.1, dt);
    }

    for (let k = rings.length - 1; k >= 0; k--) {
      const g = rings[k];
      g.r += dt * 60; g.life -= dt * 0.85;
      if (g.life <= 0) { rings.splice(k, 1); continue; }
      const band = 5, ry = (g.r + band) * (CW / CH);
      const x0 = Math.max(0, Math.floor(g.x - g.r - band)), x1 = Math.min(COLS - 1, Math.ceil(g.x + g.r + band));
      const y0 = Math.max(0, Math.floor(g.y - ry)), y1 = Math.min(ROWS - 1, Math.ceil(g.y + ry));
      for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
        const dx = x + 0.5 - g.x, dy = (y + 0.5 - g.y) * (CH / CW);
        const d = Math.hypot(dx, dy), off = Math.abs(d - g.r);
        if (off > band) continue;
        push[y * COLS + x] += Math.sign(dx || 0.01) * (1 - off / band) * 3.2 * g.life * (Math.abs(dx) / (d + 0.001) * 0.7 + 0.3);
      }
    }

    const amp = reduced ? 0.35 : 1;
    const k = 42, damp = Math.exp(-5.5 * dt);
    // the wind waves are sines of (x + y + t): split them with the angle-sum rule so each cell costs a few multiplies
    for (let x = VX0; x <= VX1; x++) {
      const a = x * 0.06 - t * 1.5, b = x * 0.17 - t * 2.3, c = x * 0.028 - t * 0.55, o = x * 6;
      TA[o] = Math.sin(a); TA[o + 1] = Math.cos(a); TA[o + 2] = Math.sin(b); TA[o + 3] = Math.cos(b); TA[o + 4] = Math.sin(c); TA[o + 5] = Math.cos(c);
    }
    for (let y = VY0; y <= Math.min(ROWS - 1, VY1 + 4); y++) {
      const ry = y * 0.035, rf = y * 0.012;

  function blob(x, y, rx, ry, lum) {

  // pose in model units: ground at y=100, body faces +x
  function pose(e) {
    const m = e.walk, ph = e.step, stout = e.cls === 'dwarf';
    const thigh = stout ? 20 : 24, shin = stout ? 19 : 23;
    const legs = [0, 1].map(k => {
      const p = ph + k * Math.PI;
      const stance = e.cls === 'knight' ? (k ? 0.42 : -0.34) : (k ? 0.16 : -0.12);
      const a = stance * (1 - m) + Math.sin(p) * 0.55 * m;
      const bend = (e.cls === 'knight' ? 0.35 : 0.12) * (1 - m) + (0.12 + Math.max(0, -Math.cos(p)) * 0.95) * m;
      const knee = P([0, 0], a, thigh), ankle = P(knee, a - bend, shin);

    const lean = 3 * m + (e.cls === 'knight' ? 2 * (1 - m) : 0);
    const torsoLen = stout ? 24 : 30;

    const sh = [neck[0], neck[1] + 3];

      const elbow = P(sh, a, stout ? 13 : 15), hand = P(elbow, a + 0.45, stout ? 12 : 14);

    });
    for (const l of legs) { l.knee = [l.knee[0], l.knee[1] + hipY]; l.ankle = [l.ankle[0], l.ankle[1] + hipY]; }
    return { legs, hip, neck, head, sh, arms, m, ph, breathe };
  }

  function drawRig(e, q) {
    const { legs, hip, neck, head, sh, arms } = q;
    const far = 0.62; // far-side limbs sit in shade
    const leg = (l, f) => { limb(hip[0], hip[1], l.knee[0], l.knee[1], 5, 4, 0.5 * f); limb(l.knee[0], l.knee[1], l.ankle[0], l.ankle[1], 4, 3.2, 0.45 * f); limb(l.ankle[0] - 1, l.ankle[1], l.ankle[0] + 6, l.ankle[1] + 1.5, 3.2, 2.4, 0.32 * f); };
    const arm = (a, f, lum) => { limb(sh[0], sh[1], a.elbow[0], a.elbow[1], 3.6, 3, lum * f); limb(a.elbow[0], a.elbow[1], a.hand[0], a.hand[1], 3, 2.6, lum * f); blob(a.hand[0], a.hand[1], 2.6, 2.6, 0.75 * f); };

    if (e.cls === 'knight') {
      // guard: blade raised forward, or a swing that sweeps from behind the head to low front
      const s = e.swing, sw = s > 0 ? Math.sin((1 - s) * Math.PI * 0.5) : 0;
      const armA = s > 0 ? -2.6 + sw * 4.0 : 2.0 + Math.sin(t * 2.2) * 0.04;
      const elbow = P(sh, armA - 0.5 * (s > 0 ? 0 : 1), 14), hand = P(elbow, armA, 12);
      const bladeA = s > 0 ? armA + 0.4 : 2.55 + q.m * 0.3;
      const tip = P(hand, bladeA, 40);
      leg(legs[0], far); arm(arms[0], far, 0.7);
      blob(arms[0].hand[0] - 2, arms[0].hand[1] - 4, 7, 10, 0.5); // shield edge
      poly([[neck[0] - 8, neck[1] + 2], [neck[0] + 8, neck[1] + 2], [hip[0] + 8, hip[1] + 2], [hip[0] - 8, hip[1] + 2]], 0.78); // breastplate
      for (let k = 1; k < 5; k++) { const yy = neck[1] + 2 + (hip[1] - neck[1]) * k / 5; line(neck[0] - 7 + (hip[0] - neck[0]) * k / 5, yy, neck[0] + 7 + (hip[0] - neck[0]) * k / 5, yy, 0.9, 0.25); } // lames
      blob(neck[0] + 2, neck[1] + 9, 4, 5, 1.05); // chest highlight
      line(hip[0] - 7, hip[1] - 4, hip[0] + 8, hip[1] - 4, 2.2, 0.3); // belt
      poly([[hip[0] - 9, hip[1] - 3], [hip[0] + 9, hip[1] - 3], [hip[0] + 12, hip[1] + 12], [hip[0] - 11, hip[1] + 12]], 0.5); // mail skirt
      leg(legs[1], 1);
      blob(legs[1].knee[0] + 1, legs[1].knee[1], 4.2, 3.6, 0.95); // knee cop
      blob(head[0], head[1], 8, 8.8, 0.88); // helm
      line(head[0] + 1, head[1] - 0.5, head[0] + 8, head[1] - 0.5, 1.8, 0.05); // visor slit
      line(head[0] + 4, head[1] - 7, head[0] + 4, head[1] + 7, 1, 0.35); // helm ridge
      line(head[0] - 2, head[1] - 8, head[0] - 9, head[1] - 12, 3, 0.6); // plume
      blob(sh[0] + 1, sh[1] + 1, 6.5, 5, 0.95); // pauldron
      limb(sh[0], sh[1], elbow[0], elbow[1], 3.8, 3.2, 0.8);
      limb(elbow[0], elbow[1], hand[0], hand[1], 3.2, 2.8, 0.8);
      limb(hand[0], hand[1], tip[0], tip[1], 1.6, 0.5, 1.0); // blade
      const g1 = P(hand, bladeA + Math.PI / 2, 5), g2 = P(hand, bladeA - Math.PI / 2, 5);
      line(g1[0], g1[1], g2[0], g2[1], 2.2, 0.85); // crossguard
      blob(hand[0], hand[1], 2.8, 2.8, 0.7);
    } else if (e.cls === 'mage') {
      leg(legs[0], far); leg(legs[1], 1);
      arm(arms[0], far, 0.5);
      const hem = Math.sin(q.ph) * 3 * q.m + Math.sin(t * 1.7) * 1.2;
      poly([[neck[0] - 7, neck[1] + 1], [neck[0] + 7, neck[1] + 1], [16 + hem, 95], [-15 + hem, 96]], 0.55); // robe
      for (let k = -2; k <= 2; k++) line(neck[0] + k * 2, neck[1] + 8, k * 6 + hem * 0.8, 94, 0.9, 0.28); // folds
      line(neck[0] - 1, neck[1] + 6, hem * 0.6, 94, 1.3, 0.95); // trim
      blob(head[0], head[1] + 1, 6, 6.5, 0.72);
      poly([[head[0] - 9, head[1] + 4], [head[0] + 9, head[1] + 2], [head[0] - 6, head[1] - 20]], 0.5); // pointed hat
      line(head[0] - 11, head[1] + 3, head[0] + 11, head[1] + 1.5, 2.4, 0.6); // brim
      poly([[head[0] - 2, head[1] + 4], [head[0] + 6, head[1] + 3], [head[0] + 2, head[1] + 16]], 0.95); // beard
      const hand = [arms[1].hand[0] + 8, arms[1].hand[1] - 4];
      limb(sh[0], sh[1], hand[0] - 5, hand[1] + 2, 3.6, 3, 0.6);
      line(hand[0] + 1, hand[1] - 34, hand[0] - 2, 98, 2.2, 0.55); // staff
      rg.fillStyle = EMIT; rg.beginPath(); rg.arc(hand[0] + 1, hand[1] - 37, 4, 0, Math.PI * 2); rg.fill();

    } else if (e.cls === 'ranger') {
      const flap = Math.sin(t * 2.6 + e.x) * 3 + q.m * 6;
      poly([[neck[0] - 4, neck[1] + 1], [neck[0] + 3, neck[1] + 2], [-6, hip[1] + 18], [-20 - flap, hip[1] + 12 - flap * 0.4]], 0.32); // cloak
      line(neck[0] - 9, neck[1] + 4, neck[0] - 3, hip[1] - 2, 4, 0.45); // quiver
      for (let k = 0; k < 3; k++) line(neck[0] - 9 + k, neck[1] + 4, neck[0] - 12 + k * 1.5, neck[1] - 4, 1, 0.9);
      leg(legs[0], far); arm(arms[0], far, 0.55);
      poly([[neck[0] - 6, neck[1] + 1], [neck[0] + 6, neck[1] + 1], [hip[0] + 7, hip[1] + 6], [hip[0] - 7, hip[1] + 6]], 0.6); // jerkin
      line(hip[0] - 6, hip[1] - 3, hip[0] + 7, hip[1] - 3, 2, 0.85);
      leg(legs[1], 1);
      blob(head[0], head[1], 6, 6.8, 0.75);
      poly([[head[0] - 8, head[1] + 6], [head[0] + 3, head[1] - 9], [head[0] + 7, head[1] - 4], [head[0] + 3, head[1] + 2], [head[0] - 2, head[1] + 8]], 0.4); // hood
      const hand = [sh[0] + 13, sh[1] + 6];

      const b1 = [hand[0] - 10 + Math.cos(-1) * 22, hand[1] + Math.sin(-1) * 22], b2 = [hand[0] - 10 + Math.cos(1) * 22, hand[1] + Math.sin(1) * 22];

      poly([[neck[0] - 12, neck[1] - 6], [neck[0] - 5, neck[1] - 8], [neck[0] - 8, neck[1] + 2]], 0.9); // axe head
      poly([[neck[0] - 10, neck[1] + 1], [neck[0] + 10, neck[1] + 1], [hip[0] + 12, hip[1] + 6], [hip[0] - 11, hip[1] + 6]], 0.55); // barrel chest
      line(hip[0] - 10, hip[1] - 2, hip[0] + 11, hip[1] - 2, 3, 0.3);
      leg(legs[1], 1);
      blob(head[0], head[1], 7, 6.5, 0.72);
      blob(head[0] - 0.5, head[1] - 3.5, 7.8, 4.6, 0.85); // helm
      line(head[0] - 7, head[1] - 4, head[0] - 12, head[1] - 10, 2.2, 0.9); // horn
      line(head[0] + 6, head[1] - 4, head[0] + 10, head[1] - 10, 2.2, 0.9);
      poly([[head[0] - 5, head[1] + 2], [head[0] + 8, head[1] + 1], [head[0] + 7, head[1] + 20], [head[0] - 1, head[1] + 24], [head[0] - 6, head[1] + 14]], 1.0); // beard
      const hand = [sh[0] + 12, sh[1] + 10];
      limb(sh[0], sh[1], hand[0], hand[1], 4, 3.2, 0.62);
